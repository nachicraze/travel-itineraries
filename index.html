<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f1e9">
  <title>Travel Itineraries</title>
  <style>
    :root { color-scheme: light; --ink:#26332d; --muted:#68756d; --paper:#f5f1e9; --card:#fffdf8; --accent:#587765; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--paper); color:var(--ink); font:16px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(100%,720px); padding:clamp(28px,6vw,56px); background:var(--card); border:1px solid #e5e0d5; border-radius:24px; box-shadow:0 18px 60px rgba(38,51,45,.08); }
    .eyebrow { margin:0 0 12px; color:var(--accent); font-size:.78rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:0; font-family:Georgia,serif; font-size:clamp(2.4rem,7vw,4.2rem); line-height:1.05; font-weight:500; }
    .intro { max-width:48ch; margin:20px 0 0; color:var(--muted); }
    .note { margin-top:32px; padding:18px 20px; border-left:3px solid var(--accent); background:#f1f3ed; border-radius:0 12px 12px 0; }
    .note strong { display:block; margin-bottom:4px; }
    footer { margin-top:32px; color:var(--muted); font-size:.85rem; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Personal travel collection</p>
    <h1>Travel Itineraries</h1>
    <p class="intro">A home for thoughtfully planned trips, destination highlights, maps and day-by-day travel guides.</p>
    <section class="note" aria-live="polite">
      <strong>Coming soon</strong>
      The first itinerary will appear here once it has been added.
    </section>
    <footer>Made for exploring, one trip at a time.</footer>
  </main>
</body>
</html>
